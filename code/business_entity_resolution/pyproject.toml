[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restorebuildrun-ber"
version = "0.1.0"
description = "Reproducible business entity resolution baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "rapidfuzz>=3.9,<4", "lightgbm>=4.6,<5"]

[project.optional-dependencies]
gpu = ["xgboost>=3.1,<4"]

[project.scripts]
ber = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
